# A sample job for de5.

resources:
  jobs:
    de5_job2:
      name: de5_job2

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: 1_silver_sales
          notebook_task:
            notebook_path: ../src/1_silver_sales.ipynb
          existing_cluster_id: 0318-031919-b3fa4xtr

        - task_key: 2_gold_sales_daily
          depends_on:
          - task_key: 1_silver_sales
          notebook_task:
            notebook_path: ../src/2_gold_sales_daily.ipynb
          existing_cluster_id: 0318-031919-b3fa4xtr

        - task_key: 3_gold_sentiment_summary
          depends_on:
          - task_key: 2_gold_sales_daily
          notebook_task:
            notebook_path: ../src/3_gold_sentiment_summary.ipynb
          existing_cluster_id: 0318-031919-b3fa4xtr
